name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  image:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch registry credentials
        if: github.event_name != 'pull_request'
        uses: https://gitea.cacahuate.org/bennight/infisical-secrets-action@b3c3a026c643086539d389c0a7e001eefbf72da0 # v1.0.0
        with:
          api-url: https://infisical.cacahuate.org
          client-id: ${{ vars.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-id: b03f80d8-53dd-4cd3-9b09-7f4770dc3ffe
          secret-path: /bennight/unifi-mcp-rs
          secrets: |
            REGISTRY_TOKEN

      - name: Check Dockerfile diagnostics
        run: |
          set -euo pipefail
          docker build --check --progress=plain \
            --build-arg 'BUILDKIT_DOCKERFILE_CHECK=error=true' \
            .

      - name: Build image
        env:
          IMAGE: gitea.cacahuate.org/bennight/unifi-mcp-rs
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          # The runner carries the crate proxy's address; the build cannot see
          # the job's environment, so it is passed in explicitly. Naming the
          # argument without its value would forward nothing, and forwarding it
          # empty would append a source naming an empty registry - so an absent
          # value means no flag at all, and cargo resolves from crates.io.
          # A pull request may build without the proxy - it publishes nothing.
          # A run that does publish must not: an absent value there means the
          # fleet's injection regressed, and building anyway would push an image
          # whose crates bypassed the proxy's cache, audit, and blocklist.
          if [ "${GITHUB_EVENT_NAME:-}" != "pull_request" ] \
             && [ -z "${CRATES_INDEX_URL:-}" ]; then
            echo "CRATES_INDEX_URL is unset; refusing to publish an image built outside the artifact proxy" >&2
            exit 1
          fi
          index_build_args=()
          if [ -n "${CRATES_INDEX_URL:-}" ]; then
            index_build_args=(--build-arg "CRATES_INDEX_URL=${CRATES_INDEX_URL}")
          fi
          docker build "${index_build_args[@]}" \
            --build-arg "SOURCE_REVISION=${GITHUB_SHA}" \
            --tag "${IMAGE}:sha-${short_sha}" --tag "${IMAGE}:latest" .

      # A build argument that is declared but never reaches cargo looks exactly
      # like one that works: both leave a green build, because the fallback
      # resolves from crates.io either way. Pointing it at a closed port
      # separates them - the builder stage has to fail, and one that succeeds
      # proves nothing was redirected.
      #
      # Skipped rather than passed when the runner supplies no address: with
      # nothing to redirect, reaching crates.io is the intended behaviour.
      - name: Check the crate index argument is load-bearing
        env:
          CRATES_INDEX_URL: "sparse+http://127.0.0.1:9/index/"
          IMAGE: gitea.cacahuate.org/bennight/unifi-mcp-rs
        run: |
          set -euo pipefail
          if [ -z "${CRATES_INDEX_URL:-}" ]; then
            echo "SKIP: no crate index configured, so crates.io is the correct source"
            exit 0
          fi
          probe_tag="${IMAGE}:probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          probe_log="$(mktemp)"
          # Built through the same forwarding the real build uses, with the
          # address supplied by this step's environment rather than hard-coded
          # into the command, so the probe exercises that construction too.
          probe_build_args=()
          if [ -n "${CRATES_INDEX_URL:-}" ]; then
            probe_build_args=(--build-arg "CRATES_INDEX_URL=${CRATES_INDEX_URL}")
          fi
          if [ ${#probe_build_args[@]} -eq 0 ]; then
            echo "the probe forwarded nothing; the forwarding construction is broken" >&2
            exit 1
          fi
          if docker build "${probe_build_args[@]}" \
              --target builder \
              --tag "$probe_tag" . >"$probe_log" 2>&1; then
            docker image rm "$probe_tag" >/dev/null 2>&1 || true
            echo "the build resolved crates without consulting CRATES_INDEX_URL" >&2
            exit 1
          fi
          # A failure alone proves nothing - a missing base image or a compile
          # error would fail too. Require the failure to name the unreachable
          # endpoint, so only a genuine index lookup counts.
          if ! grep -q "127.0.0.1:9" "$probe_log"; then
            echo "the probe build failed for an unrelated reason:" >&2
            tail -40 "$probe_log" >&2
            exit 1
          fi
          echo "cargo failed reaching the unreachable index, as required"

      - name: Smoke image health endpoint
        env:
          IMAGE: gitea.cacahuate.org/bennight/unifi-mcp-rs
          UNIFI_MCP_LOG_LEVEL: info
          UNIFI_MCP_GATEWAY_BEARER_CURRENT: 0123456789abcdef0123456789abcdef
          UNIFI_MCP_IDENTITY_JWKS_URL: http://127.0.0.1:65533/jwks
          UNIFI_MCP_IDENTITY_ISSUER: https://gateway.test
          UNIFI_MCP_IDENTITY_ACTOR: mcp.cacahuate.org
          UNIFI_MCP_CONTROLLER_URL: https://127.0.0.1:65532
          UNIFI_MCP_CONTROLLER_API_KEY: smoke-controller-api-key
          UNIFI_MCP_CONTROLLER_USERNAME: smoke-user
          UNIFI_MCP_CONTROLLER_PASSWORD: smoke-controller-password
        run: |
          set -euo pipefail
          container_name="unifi-mcp-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker create --name "$container_name" \
            -e UNIFI_MCP_LOG_LEVEL \
            -e UNIFI_MCP_GATEWAY_BEARER_CURRENT \
            -e UNIFI_MCP_IDENTITY_JWKS_URL \
            -e UNIFI_MCP_IDENTITY_ISSUER \
            -e UNIFI_MCP_IDENTITY_ACTOR \
            -e UNIFI_MCP_CONTROLLER_URL \
            -e UNIFI_MCP_CONTROLLER_API_KEY \
            -e UNIFI_MCP_CONTROLLER_USERNAME \
            -e UNIFI_MCP_CONTROLLER_PASSWORD \
            "${IMAGE}:latest" >/dev/null
          docker start "$container_name" >/dev/null
          ready=0
          for _ in $(seq 1 30); do
            if docker exec "$container_name" /unifi-mcp-rs --healthcheck >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            docker logs "$container_name"
            exit 1
          fi

      - name: Publish image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: gitea.cacahuate.org/bennight/unifi-mcp-rs
          # The account is not a secret and lives in a repository variable;
          # only the token beside it in Infisical is. Both are named here so
          # the step fails on an unset value rather than on a login the
          # registry rejects for no stated reason.
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
        run: |
          set -euo pipefail
          : "${REGISTRY_USER:?REGISTRY_USER repository variable is unset}"
          : "${REGISTRY_TOKEN:?REGISTRY_TOKEN was not fetched from Infisical}"
          printf '%s' "$REGISTRY_TOKEN" | docker login gitea.cacahuate.org --username "$REGISTRY_USER" --password-stdin
          short_sha="${GITHUB_SHA::12}"
          docker push "${IMAGE}:sha-${short_sha}"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            docker push "${IMAGE}:latest"
          fi
