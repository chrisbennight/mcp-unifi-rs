blocked_paths: []
notes:
  - "This server is a curated typed operational interface for UniFi controllers, never a raw API proxy. The tool surface is a small set of workflow tools; generic request forwarding, arbitrary endpoint mapping, terminal/shell access, and unbounded responses are outside the contract. Review scope is the design goal of a useful, safe UniFi capability — findings that would shrink or gut that capability to satisfy a stylistic concern should be rebutted, not absorbed."
  - "Controller credentials (Integration API keys, local admin session credentials) are environment-injected, never model-visible, never logged, and never selectable by caller input. Wi-Fi passphrases, PSKs, VPN keys, and SNMP strings are redacted by default in tool responses; a write that echoes a redaction marker is rejected."
  - "Gateway /mcp requests require both the rotating gateway bearer and a verified gateway identity JWT; the gateway catalog owns risk and group authorization. Direct HTTP requires its separate rotating bearer and Host/Origin checks. Stdio trusts the process owner. Independent transports default to read access and enforce separate operator-granted write and secret-disclosure permissions. Network membership, tool annotations and confirmation arguments are not authorization."
  - "Mutations preview by default (confirm=false returns a diff), validate their complete bounded input before the upstream call, are never retried after an ambiguous transport result, and verify persistence by reading back — the UniFi controller acknowledges writes it silently drops."
  - "Capability detection is a correctness boundary: an empty result must be distinguishable from 'this console does not support that API generation' (zone-based versus classic firewall in particular). Tools must not present an unsupported probe as an empty inventory."
  - "Bounded everything: lists paginate, responses respect an in-server size budget, strings and durations are bounded, and raw upstream errors are translated, never forwarded."
  - "Dockerfile and workflow changes are supply-chain sensitive. Preserve digest pins, locked builds, and non-root runtime. Pull requests have no publication credentials; GHCR publication uses the job-scoped GitHub token after source and image checks pass, and only consumes the tested image from that workflow run."
