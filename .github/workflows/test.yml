name: test

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # renovate: datasource=github-tags depName=rust-lang/rustup
      RUSTUP_INIT_VERSION: "1.29.0"
      RUSTUP_INIT_SHA256: "4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10"
      # renovate: datasource=github-releases depName=rust-lang/rust
      RUST_TOOLCHAIN_VERSION: "1.96.0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl -fsSL -o /tmp/rustup-init \
              "https://static.rust-lang.org/rustup/archive/${RUSTUP_INIT_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
            echo "${RUSTUP_INIT_SHA256}  /tmp/rustup-init" | sha256sum -c -
            chmod +x /tmp/rustup-init
            /tmp/rustup-init -y --default-toolchain none --profile minimal --no-modify-path
            rm -f /tmp/rustup-init
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install "${RUST_TOOLCHAIN_VERSION}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN_VERSION}"

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test all features
        run: cargo test --workspace --all-features --locked

      - name: Verify gateway manifest emission
        run: |
          set -euo pipefail
          manifest="$(cargo run --locked -p unifi-server -- --emit-gateway-manifest)"
          printf '%s\n' "$manifest" | grep -Fx 'name: unifi'
          printf '%s\n' "$manifest" | grep -Fx 'classification_mode: mcp_annotations'
          printf '%s\n' "$manifest" | grep -Fx '  bearer_env: MCP_GATEWAY_UPSTREAM_BEARER_UNIFI'
          printf '%s\n' "$manifest" | grep -Fx '  isolation: per_call'

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Validate documentation links
        run: python3 scripts/check_docs.py

      - name: Test documentation validator
        run: python3 -m unittest discover -s scripts/tests
