name: test

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # renovate: datasource=github-tags depName=rust-lang/rustup
      RUSTUP_INIT_VERSION: "1.29.1"
      RUSTUP_INIT_SHA256: "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71"
      # renovate: datasource=github-releases depName=rust-lang/rust
      RUST_TOOLCHAIN_VERSION: "1.98.1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select changed components
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci-scope.sh
      - name: Install the pinned Rust toolchain
        if: steps.scope.outputs.rust == 'true'
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl -fsSL -o /tmp/rustup-init \
              "https://static.rust-lang.org/rustup/archive/${RUSTUP_INIT_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
            echo "${RUSTUP_INIT_SHA256}  /tmp/rustup-init" | sha256sum -c -
            chmod +x /tmp/rustup-init
            /tmp/rustup-init -y --default-toolchain none --profile minimal --no-modify-path
            rm -f /tmp/rustup-init
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install "${RUST_TOOLCHAIN_VERSION}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN_VERSION}"

      - name: Verify formatting
        if: steps.scope.outputs.rust == 'true'
        run: cargo fmt --all -- --check

      - name: Lint all targets
        if: steps.scope.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test all features
        if: steps.scope.outputs.rust == 'true'
        run: cargo test --workspace --all-features --locked

      - name: Verify gateway manifest emission
        if: steps.scope.outputs.rust == 'true'
        run: |
          set -euo pipefail
          manifest="$(cargo run --locked -p unifi-server -- --emit-gateway-manifest)"
          printf '%s\n' "$manifest" | grep -Fx 'name: unifi'
          printf '%s\n' "$manifest" | grep -Fx 'classification_mode: mcp_annotations'
          printf '%s\n' "$manifest" | grep -Fx '  bearer_env: MCP_GATEWAY_UPSTREAM_BEARER_UNIFI'
          printf '%s\n' "$manifest" | grep -Fx '  isolation: per_call'

      - name: Build documentation
        if: steps.scope.outputs.rust == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Validate documentation links
        if: steps.scope.outputs.docs == 'true'
        run: python3 scripts/check_docs.py

      - name: Test documentation validator
        if: steps.scope.outputs.python == 'true'
        run: python3 -m unittest discover -s scripts/tests
