name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: ./.github/workflows/test.yml

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/chrisbennight/mcp-unifi-rs
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      SYFT_IMAGE: anchore/syft:v1.51.1@sha256:95fe0835e5bebc6f8b1f8acef68d47d63d594ef4c0f25c097ff853b23cbac74c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose examples
        env:
          UNIFI_MCP_HTTP_BEARER_CURRENT: 0123456789abcdef0123456789abcdef
        run: |
          docker compose --env-file .env.example -f compose.example.yml config --quiet
          docker compose --env-file .env.protect.example -f compose.protect.example.yml config --quiet

      - name: Scan tracked source for secrets
        run: |
          set -euo pipefail
          mkdir "${RUNNER_TEMP}/source-scan"
          git archive HEAD | tar -x -C "${RUNNER_TEMP}/source-scan"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            -v "${RUNNER_TEMP}/source-scan:/scan:ro" \
            "$GITLEAKS_IMAGE" dir --redact=100 --no-banner /scan

      - name: Verify build-context isolation
        run: python3 scripts/check_build_context.py

      - name: Check Dockerfile diagnostics
        run: docker build --check --build-arg 'BUILDKIT_DOCKERFILE_CHECK=error=true' .

      - name: Build image
        run: |
          set -euo pipefail
          docker build --build-arg "SOURCE_REVISION=${GITHUB_SHA}" \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" .

      - name: Smoke both runtime surfaces
        run: python3 scripts/smoke_image.py "${IMAGE}:sha-${GITHUB_SHA}"

      - name: Save tested image
        run: docker save --output "${RUNNER_TEMP}/image.tar" "${IMAGE}:sha-${GITHUB_SHA}"

      - name: Inventory source and tested image
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,nodev,mode=1777 \
            --user "$(id -u):$(id -g)" \
            -e SYFT_CHECK_FOR_APP_UPDATE=false -e SYFT_CACHE_DIR=/tmp/syft-cache \
            -v "${RUNNER_TEMP}/source-scan:/scan:ro" \
            "$SYFT_IMAGE" scan dir:/scan --source-name mcp-unifi-rs \
              --source-version "$GITHUB_SHA" -o spdx-json > "${RUNNER_TEMP}/source.spdx.json"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,nodev,mode=1777 \
            --user "$(id -u):$(id -g)" \
            -e SYFT_CHECK_FOR_APP_UPDATE=false -e SYFT_CACHE_DIR=/tmp/syft-cache \
            -v "${RUNNER_TEMP}/image.tar:/image.tar:ro" \
            "$SYFT_IMAGE" scan docker-archive:/image.tar -o spdx-json > "${RUNNER_TEMP}/image.spdx.json"
          docker image inspect --format '{{json .}}' "${IMAGE}:sha-${GITHUB_SHA}" > "${RUNNER_TEMP}/image-metadata.json"
          printf '%s\n' "$GITHUB_SHA" > "${RUNNER_TEMP}/source-revision.txt"
          cd "$RUNNER_TEMP"
          sha256sum image.tar image.spdx.json source.spdx.json image-metadata.json source-revision.txt > inventory-checksums.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: software-inventory
          path: |
            ${{ runner.temp }}/image.spdx.json
            ${{ runner.temp }}/source.spdx.json
            ${{ runner.temp }}/image-metadata.json
            ${{ runner.temp }}/source-revision.txt
            ${{ runner.temp }}/inventory-checksums.txt
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.repository == 'chrisbennight/mcp-unifi-rs'
        with:
          name: tested-image
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: [test, image]
    if: github.event_name == 'push' && github.repository == 'chrisbennight/mcp-unifi-rs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/chrisbennight/mcp-unifi-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate publication tags
        run: python3 scripts/image_tags.py --sha "$GITHUB_SHA" --ref "$GITHUB_REF" > "${RUNNER_TEMP}/image-tags.txt"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-image
          path: ${{ runner.temp }}/tested-image
          digest-mismatch: error

      - name: Load and verify tested image
        run: |
          set -euo pipefail
          docker load --input "${RUNNER_TEMP}/tested-image/image.tar"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${IMAGE}:sha-${GITHUB_SHA}")"
          test "$revision" = "$GITHUB_SHA"

      - name: Publish image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker-publish"
          mkdir -m 700 "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          while IFS= read -r tag; do
            docker tag "${IMAGE}:sha-${GITHUB_SHA}" "${IMAGE}:${tag}"
            docker push "${IMAGE}:${tag}"
          done < "${RUNNER_TEMP}/image-tags.txt"
