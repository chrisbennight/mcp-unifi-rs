# Protect over directly authenticated HTTP, published only on host loopback.
# Pin the image digest for repeatable deployment; see README.md.
services:
  unifi-protect-mcp:
    image: ghcr.io/chrisbennight/mcp-unifi-rs:latest
    restart: unless-stopped
    command: ["--transport", "http"]
    environment:
      UNIFI_MCP_SURFACE: protect
      UNIFI_MCP_HOST: 0.0.0.0
      UNIFI_MCP_LOG_LEVEL: ${UNIFI_MCP_LOG_LEVEL:-info}
      UNIFI_MCP_HTTP_BEARER_CURRENT: ${UNIFI_MCP_HTTP_BEARER_CURRENT:?Set the dedicated HTTP bearer}
      UNIFI_MCP_HTTP_BEARER_PREVIOUS:
      UNIFI_MCP_ALLOWED_HOSTS:
      UNIFI_MCP_ALLOWED_ORIGINS:
      UNIFI_MCP_PROTECT_URL: ${UNIFI_MCP_PROTECT_URL:?Set the Protect console URL}
      UNIFI_MCP_PROTECT_API_KEY: ${UNIFI_MCP_PROTECT_API_KEY:?Set the Protect key}
      UNIFI_MCP_PROTECT_USERNAME: ${UNIFI_MCP_PROTECT_USERNAME:-}
      UNIFI_MCP_PROTECT_PASSWORD: ${UNIFI_MCP_PROTECT_PASSWORD:-}
      UNIFI_MCP_PROTECT_TLS: ${UNIFI_MCP_PROTECT_TLS:-system}
      UNIFI_MCP_PROTECT_CERT_SHA256: ${UNIFI_MCP_PROTECT_CERT_SHA256:-}
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "/mcp-unifi-rs", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
